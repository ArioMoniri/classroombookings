# Dashboards as code (W3-OPS): ../dashboards/*.json, generated by ../build_dashboards.py. Turkish titles first.
apiVersion: 1
providers:
  - name: smartsched
    folder: SmartSched
    folderUid: smartsched
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana-dashboards
      foldersFromFilesStructure: false
