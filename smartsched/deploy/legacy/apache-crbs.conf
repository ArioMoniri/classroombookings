# Apache config for the legacy CRBS app (CodeIgniter 3 front controller).
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^(.*)$ index.php/$1 [L]
</Directory>
<DirectoryMatch "/var/www/html/(crbs-core|local|smartsched)">
    Require all denied
</DirectoryMatch>
