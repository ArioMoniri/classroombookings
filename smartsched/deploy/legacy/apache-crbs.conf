# Apache config for the legacy CRBS app (CodeIgniter 3 front controller); mirrors .htaccess.txt.
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^(.*)$ index.php/$1 [L]
</Directory>
# Application code, config (DB credentials), sessions and logs are never served directly.
<DirectoryMatch "^/var/www/html/(crbs-core|local)">
    Require all denied
</DirectoryMatch>
# Dotfiles (.htaccess, .env, .git*) are never served.
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
