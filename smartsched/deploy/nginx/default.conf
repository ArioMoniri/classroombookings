# SmartSched reverse proxy (nginx). Listens on :80 inside the container; the host port is
# PROXY_PORT in .env. TLS: terminate in front of this container (see deploy/README.md).
#
# Routing
#   /                 → frontend (Next.js standalone)
#   /api/v1/*         → frontend route handler → backend. The handler attaches the JWT from the
#                       httpOnly session cookie, so the browser never talks to FastAPI directly.
#   /api/docs, /api/openapi.json → backend (Swagger UI for operators)
#   /uploads/*        → backend (workbooks, room photos)
#   /api/v1/runs/*/events → SSE: buffering off, long read timeout.

upstream smartsched_frontend {
    server frontend:3000;
    keepalive 32;
}

upstream smartsched_backend {
    server backend:8000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;          # Excel workbooks, room photos
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Server-sent events (solver progress): never buffer, keep the connection open for long runs.
    location ~ ^/api/v1/runs/[^/]+/events$ {
        proxy_pass http://smartsched_frontend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Swagger UI / OpenAPI for operators (no auth, read-only).
    location = /api/docs { proxy_pass http://smartsched_backend; }
    location = /api/openapi.json { proxy_pass http://smartsched_backend; }

    # Everything else under /api goes through the Next.js route handler (cookie → bearer token).
    location /api/ {
        proxy_pass http://smartsched_frontend;
        proxy_request_buffering off;   # stream multipart uploads straight through
    }

    # Uploaded files are served by FastAPI's StaticFiles mount.
    location /uploads/ {
        proxy_pass http://smartsched_backend;
        expires 1h;
    }

    # Next.js static assets are immutable (hashed file names).
    location /_next/static/ {
        proxy_pass http://smartsched_frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://smartsched_frontend;
    }
}
