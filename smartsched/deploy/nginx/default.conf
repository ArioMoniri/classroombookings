# SmartSched reverse proxy (nginxinc/nginx-unprivileged: runs as uid 101, listens on :8080 inside the
# container; the host port is PROXY_PORT in .env). TLS: terminate in front of this container
# (Caddy / certbot, see deploy/README.md "TLS").
#
# Routing
#   /                     -> frontend (Next.js standalone)
#   /api/v1/*             -> frontend route handler -> backend. The handler attaches the JWT from the
#                            httpOnly session cookie, so the browser never talks to FastAPI directly.
#   /api/v1/runs/*/events -> same, as server-sent events: no buffering, no upstream gzip, 1 h timeout.
#   /api/docs, /api/redoc, /api/openapi.json -> 404 (production serves no API docs; dev runs uvicorn
#                            directly on :8000/api/docs)
#   /uploads/rooms/*      -> backend StaticFiles mount (room photos); every other /uploads path is 404
#                            (imported workbooks live there and the mount has no auth)
#   /healthz              -> nginx itself (container healthcheck)

upstream smartsched_frontend {
    server frontend:3000;
    keepalive 32;
}

upstream smartsched_backend {
    server backend:8000;
    keepalive 32;
}

# WebSocket upgrade when asked for; otherwise an empty Connection header so upstream keepalive works.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Behind a TLS edge (Caddy, docker-compose.caddy.yml, or a host nginx/certbot) keep its scheme so the
# backend builds https:// URLs; direct clients get this hop's scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# ---- security headers (wave 3 W3-SEC, docs/SECURITY.md §5) -----------------------------------------------
# One CSP for the app pages. Next.js (App Router) streams inline <script> chunks without a nonce today, so
# script-src keeps 'unsafe-inline' (no 'unsafe-eval'); a nonce-based policy from the frontend wins: when the
# upstream already sent a Content-Security-Policy this one is not added. frame-ancestors 'none' everywhere except
# /grafana/ (W3-OPS embeds its panels in /admin/ops: same origin only).
map $uri $smartsched_frame_ancestors {
    ~^/grafana/ "'self'";
    default     "'none'";
}
map $uri $smartsched_frame_options {
    ~^/grafana/ SAMEORIGIN;
    default     DENY;
}
map $upstream_http_content_security_policy $smartsched_csp {
    ""      "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://login.microsoftonline.com; frame-ancestors $smartsched_frame_ancestors";
    default "";
}
# HSTS only when the client reached us over TLS (the Caddy edge or a host proxy sets X-Forwarded-Proto https)
map $forwarded_proto $smartsched_hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}
# CSRF fence for the cookie-authenticated API (the Next.js handler turns the httpOnly cookie into a bearer token):
# a state-changing request that a browser marks as cross-site, or whose Origin names another host, never reaches it.
map "$request_method:$http_sec_fetch_site" $smartsched_cross_site_write {
    ~^(POST|PUT|PATCH|DELETE):cross-site$ 1;
    default 0;
}
map $http_origin $smartsched_origin_host {
    ~^https?://(?<origin_hostport>[^/]+)$ $origin_hostport;
    default "";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Trust X-Forwarded-For only from private networks (docker bridge, the Caddy container, a host proxy); upstreams
    # get the resolved client address only ($remote_addr), never a chain the client wrote itself (W3-SEC).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 50m;          # Excel workbooks, room photos
    proxy_http_version 1.1;
    # NOTE: a location that declares any proxy_set_header loses all of these, so the SSE location
    # repeats them.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    # Imports of large workbooks and synchronous exports can take a while.
    proxy_read_timeout    300s;

    # security headers (repeated in every location that sets its own add_header: nginx does not merge them)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options $smartsched_frame_options always;
    add_header Content-Security-Policy $smartsched_csp always;
    add_header Strict-Transport-Security $smartsched_hsts always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header X-Permitted-Cross-Domain-Policies none always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # RFC 9116 security contact: built by the backend from the institution's settings (Admin > Ayarlar > Güvenlik
    # iletişimi; app/services/security_txt.py), Expires always one year ahead. security follow-up wave3-sec2.
    location = /.well-known/security.txt {
        access_log off;
        proxy_pass http://smartsched_backend;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'" always;
    }
    location = /security.txt {
        access_log off;
        proxy_pass http://smartsched_backend;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'" always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Server-sent events (solver progress): never buffer, keep the connection open for long runs and
    # ask the upstream for an uncompressed stream (Next.js would otherwise gzip and hold the events).
    location ~ ^/api/v1/(runs|council/jobs)/[^/]+/events$ {
        proxy_pass http://smartsched_frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_set_header Accept-Encoding   "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # No public API docs (no-placeholder audit m6): the backend disables them with ENVIRONMENT=prod and
    # the proxy never forwards them either.
    location ~ ^/api/(docs|redoc|openapi\.json)$ { return 404; }

    # Calendar subscription feeds carry a private token in the URL (calendar apps cannot send headers):
    # straight to the backend, never written to the access log. Only the token feed URLs (`<token>/….ics`):
    # /calendar/feeds/options, /tokens and /reset are cookie-authenticated and go through the Next.js handler
    # (W3-SEC stack check: sending them here answered 401, which cleared the session cookie).
    location ~ ^/api/v1/(calendar/feeds|ics)/[^/]+/.+\.ics$ {
        access_log off;
        proxy_pass http://smartsched_backend;
    }

    # Everything else under /api goes through the Next.js route handler (cookie -> bearer token).
    location /api/ {
        if ($smartsched_cross_site_write) { return 403; }
        set $smartsched_origin_bad "";
        if ($request_method ~ ^(POST|PUT|PATCH|DELETE)$) { set $smartsched_origin_bad "w"; }
        if ($smartsched_origin_host = "") { set $smartsched_origin_bad ""; }
        if ($smartsched_origin_host = $http_host) { set $smartsched_origin_bad ""; }
        if ($smartsched_origin_bad = "w") { return 403; }
        proxy_pass http://smartsched_frontend;
        proxy_request_buffering off;   # stream multipart uploads straight through
    }

    # Uploaded files are served by FastAPI's StaticFiles mount (unauthenticated!). Only room photos are
    # public; /uploads/imports/<job>_<name>.xlsx holds the planners' source workbooks (instructor names)
    # and must never be reachable from the browser.
    location /uploads/rooms/ {
        proxy_pass http://smartsched_backend;
        expires 1h;
    }
    location /uploads/ {
        return 404;
    }

    # Next.js static assets are immutable (hashed file names).
    location /_next/static/ {
        proxy_pass http://smartsched_frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security $smartsched_hsts always;
    }

    # ---- Grafana (compose profile "observability", W3-OPS) behind the SmartSched admin session --------------
    # auth_request asks the backend (through the Next.js handler, which turns the session cookie into the bearer
    # token) whether the caller is an admin: 204 -> proxied with X-WEBAUTH-USER (Grafana auth.proxy), 401 -> the
    # login page, 403 -> 403. The client's own X-WEBAUTH-USER never reaches Grafana (always overwritten).
    # A variable upstream + Docker's resolver: nginx starts (and /grafana/ answers 502) when Grafana is not running.
    location = /grafana { absolute_redirect off; return 301 /grafana/; }
    location /grafana/ {
        auth_request /_ops/grafana-auth;
        error_page 401 = @grafana_login;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $smartsched_grafana http://grafana:3000;
        proxy_pass $smartsched_grafana;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header X-WEBAUTH-USER    smartsched-admin;
        proxy_set_header Authorization     "";
    }
    location = /_ops/grafana-auth {
        internal;
        proxy_pass http://smartsched_frontend/api/v1/ops/grafana-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host            $host;
        proxy_set_header X-Original-URI  $request_uri;
        proxy_set_header Cookie          $http_cookie;
    }
    location @grafana_login {
        absolute_redirect off;
        return 302 /login?next=$request_uri;
    }

    # The backend's Prometheus endpoint (W3-OPS app/core/observability.py) answers private addresses, and this proxy
    # is one of them: never route it (Prometheus scrapes backend:8000/metrics on the compose network). W3-SEC.
    location = /metrics { return 404; }
    location /metrics/ { return 404; }

    location / {
        proxy_pass http://smartsched_frontend;
    }
}
