# SmartSched reverse proxy (nginxinc/nginx-unprivileged: runs as uid 101, listens on :8080 inside the
# container; the host port is PROXY_PORT in .env). TLS: terminate in front of this container
# (Caddy / certbot, see deploy/README.md "TLS").
#
# Routing
#   /                     -> frontend (Next.js standalone)
#   /api/v1/*             -> frontend route handler -> backend. The handler attaches the JWT from the
#                            httpOnly session cookie, so the browser never talks to FastAPI directly.
#   /api/v1/runs/*/events -> same, as server-sent events: no buffering, no upstream gzip, 1 h timeout.
#   /api/docs, /api/redoc, /api/openapi.json -> 404 (production serves no API docs; dev runs uvicorn
#                            directly on :8000/api/docs)
#   /uploads/rooms/*      -> backend StaticFiles mount (room photos); every other /uploads path is 404
#                            (imported workbooks live there and the mount has no auth)
#   /healthz              -> nginx itself (container healthcheck)

upstream smartsched_frontend {
    server frontend:3000;
    keepalive 32;
}

upstream smartsched_backend {
    server backend:8000;
    keepalive 32;
}

# WebSocket upgrade when asked for; otherwise an empty Connection header so upstream keepalive works.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Behind a TLS edge (Caddy, docker-compose.caddy.yml, or a host nginx/certbot) keep its scheme so the
# backend builds https:// URLs; direct clients get this hop's scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Trust X-Forwarded-For only from private networks (docker bridge, the Caddy container, a host proxy).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 50m;          # Excel workbooks, room photos
    proxy_http_version 1.1;
    # NOTE: a location that declares any proxy_set_header loses all of these, so the SSE location
    # repeats them.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    # Imports of large workbooks and synchronous exports can take a while.
    proxy_read_timeout    300s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Server-sent events (solver progress): never buffer, keep the connection open for long runs and
    # ask the upstream for an uncompressed stream (Next.js would otherwise gzip and hold the events).
    location ~ ^/api/v1/runs/[^/]+/events$ {
        proxy_pass http://smartsched_frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_set_header Accept-Encoding   "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # No public API docs (no-placeholder audit m6): the backend disables them with ENVIRONMENT=prod and
    # the proxy never forwards them either.
    location ~ ^/api/(docs|redoc|openapi\.json)$ { return 404; }

    # Everything else under /api goes through the Next.js route handler (cookie -> bearer token).
    location /api/ {
        proxy_pass http://smartsched_frontend;
        proxy_request_buffering off;   # stream multipart uploads straight through
    }

    # Uploaded files are served by FastAPI's StaticFiles mount (unauthenticated!). Only room photos are
    # public; /uploads/imports/<job>_<name>.xlsx holds the planners' source workbooks (instructor names)
    # and must never be reachable from the browser.
    location /uploads/rooms/ {
        proxy_pass http://smartsched_backend;
        expires 1h;
    }
    location /uploads/ {
        return 404;
    }

    # Next.js static assets are immutable (hashed file names).
    location /_next/static/ {
        proxy_pass http://smartsched_frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://smartsched_frontend;
    }
}
