# SmartSched — one-click stack. Run via ./deploy.sh (generates .env) or:
#   docker compose --env-file .env up -d --build
# Services: db (Postgres), backend (FastAPI + in-process solver queue), frontend (Next.js),
# proxy (nginx). Profile "legacy": crbs (php-apache) + crbs-db (MySQL) for the old CRBS app.
#
# There is no separate "worker" service: app/cli.py has no worker command and solver jobs run in
# the backend's in-process asyncio queue (app/workers/queue.py). See README.md "Scaling".

name: ${COMPOSE_PROJECT_NAME:-smartsched}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartsched}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-smartsched}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "${DB_CPUS:-2}"
          memory: ${DB_MEMORY:-2g}
    logging: *default-logging

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        EXTRA_PIP: ${BACKEND_EXTRA_PIP:-}
    image: smartsched-backend:${SMARTSCHED_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-smartsched}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smartsched}}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080"]}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-720}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      SOLVER_DEFAULT_TIME_LIMIT: ${SOLVER_DEFAULT_TIME_LIMIT:-60}
      SOLVER_WORKERS: ${SOLVER_WORKERS:-8}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    expose:
      - "8000"
    # Healthcheck comes from the image (GET /api/v1/health); repeated here so `depends_on` is explicit.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4); sys.exit(0 if r.status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "${BACKEND_CPUS:-4}"
          memory: ${BACKEND_MEMORY:-4g}
    logging: *default-logging

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000}
        NEXT_PUBLIC_API_MOCK: ${NEXT_PUBLIC_API_MOCK:-0}
    image: smartsched-frontend:${SMARTSCHED_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000}
      NEXT_PUBLIC_API_MOCK: ${NEXT_PUBLIC_API_MOCK:-0}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --spider http://127.0.0.1:3000/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "${FRONTEND_CPUS:-1}"
          memory: ${FRONTEND_MEMORY:-1g}
    logging: *default-logging

  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "${PROXY_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --spider http://127.0.0.1/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: ${PROXY_MEMORY:-256m}
    logging: *default-logging

  # ---- optional legacy classroombookings (CRBS) so the live app can be imported from -------------
  crbs-db:
    profiles: ["legacy"]
    image: mysql:8.4
    restart: unless-stopped
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${CRBS_DB_ROOT_PASSWORD:?set CRBS_DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${CRBS_DB_NAME:-crbs}
      MYSQL_USER: ${CRBS_DB_USER:-crbs}
      MYSQL_PASSWORD: ${CRBS_DB_PASSWORD:?set CRBS_DB_PASSWORD in .env}
    volumes:
      - crbs-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    logging: *default-logging

  crbs:
    profiles: ["legacy"]
    build:
      context: ../..
      dockerfile: smartsched/deploy/legacy/Dockerfile
    image: smartsched-crbs:${SMARTSCHED_TAG:-latest}
    restart: unless-stopped
    depends_on:
      crbs-db:
        condition: service_healthy
    environment:
      CRBS_DB_HOST: crbs-db
      CRBS_DB_NAME: ${CRBS_DB_NAME:-crbs}
      CRBS_DB_USER: ${CRBS_DB_USER:-crbs}
      CRBS_DB_PASSWORD: ${CRBS_DB_PASSWORD}
    volumes:
      # The legacy app runs straight from the checkout; local/ and uploads/ must be writable by
      # uid 33 (www-data): `chmod -R a+rwX local uploads` at the repo root (see README.md).
      - ../..:/var/www/html
      - ./legacy/config.php:/var/www/html/local/config.php:ro
    ports:
      - "${CRBS_PORT:-8081}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
    logging: *default-logging

volumes:
  pgdata:
  uploads:
  crbs-mysql:
