# SmartSched — one-click stack. Run via ./deploy.sh (generates .env) or:
#   docker compose --env-file .env up -d --build
# Services: db (Postgres), backend (FastAPI + in-process solver queue), frontend (Next.js),
# proxy (nginx). Profile "legacy": crbs (php-apache) + crbs-db (MySQL) for the old CRBS app.
# Profile "observability" (./deploy.sh --observability): prometheus, loki, alloy, grafana (observability/README.md;
# measured ~0.5 GB RSS, capped at 768 MiB together; Grafana at /grafana/ behind the SmartSched admin session).
#
# There is no separate "worker" service: app/cli.py has no worker command and solver/import jobs run
# in the backend's in-process asyncio queue (app/workers/queue.py, status persisted in the DB rows).
# See README.md "Scaling" before running more than one backend replica.
#
# Every image tag is pinned to a patch release; locally built images are tagged ${SMARTSCHED_TAG}.
# Resource limits below are examples sized for ~1 500 sections (README.md "Sizing").

name: ${COMPOSE_PROJECT_NAME:-smartsched}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    # the compose service/project names go into every json-file line ("attrs"): Alloy labels the logs it ships to
    # Loki with them without the Docker socket (observability/alloy/config.alloy)
    labels: "com.docker.compose.service,com.docker.compose.project"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartsched}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-smartsched}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 30s
    <<: *hardening
    deploy:
      resources:
        limits:
          cpus: "${DB_CPUS:-2}"
          memory: ${DB_MEMORY:-2g}
    logging: *default-logging

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        # base images by digest (pins.py; refresh with ./pin-digests.sh); the Dockerfile default names the tag
        PYTHON_IMAGE: python:3.12.15-slim-bookworm@sha256:34386ef0cb081344d7ec1c103ba398e6e9f64e9ab3a1509accc92a4e24a07258
        EXTRA_PIP: ${BACKEND_EXTRA_PIP:-}
    image: smartsched-backend:${SMARTSCHED_TAG:-0.1.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-smartsched}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smartsched}}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080"]}
      PUBLIC_URL: ${PUBLIC_URL:-}   # OAuth redirect + calendar feed links (calendar sync)
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-720}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      SEED_ADMIN: ${SEED_ADMIN:-1}
      SOLVER_DEFAULT_TIME_LIMIT: ${SOLVER_DEFAULT_TIME_LIMIT:-60}
      SOLVER_WORKERS: ${SOLVER_WORKERS:-8}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      COUNCIL_AI: ${COUNCIL_AI:-1}
      COUNCIL_MODEL: ${COUNCIL_MODEL:-}
      COUNCIL_FAST_MODEL: ${COUNCIL_FAST_MODEL:-}
      COUNCIL_REVIEW_THRESHOLD: ${COUNCIL_REVIEW_THRESHOLD:-0.75}
      COUNCIL_STEP_TIMEOUT_S: ${COUNCIL_STEP_TIMEOUT_S:-300}
      COUNCIL_JOB_TOKEN_BUDGET: ${COUNCIL_JOB_TOKEN_BUDGET:-600000}
      COUNCIL_MAX_FILES: ${COUNCIL_MAX_FILES:-25}
      COUNCIL_MAX_FILE_MB: ${COUNCIL_MAX_FILE_MB:-15}
      COUNCIL_MAX_JOB_MB: ${COUNCIL_MAX_JOB_MB:-50}
      COUNCIL_SELF_CONSISTENCY: ${COUNCIL_SELF_CONSISTENCY:-1}
      COUNCIL_JUDGE_SAMPLE: ${COUNCIL_JUDGE_SAMPLE:-12}
      UPLOAD_DIR: /data/uploads
      # operations panel (/admin/ops, app/api/v1/ops.py): internal URLs of the observability profile, pod CI page,
      # the deployed commit (deploy.sh exports RELEASE_SHA / DEPLOYED_AT) and an optional Sentry DSN
      OPS_GRAFANA_URL: ${OPS_GRAFANA_URL:-http://grafana:3000/grafana}
      OPS_PROMETHEUS_URL: ${OPS_PROMETHEUS_URL:-http://prometheus:9090}
      OPS_LOKI_URL: ${OPS_LOKI_URL:-http://loki:3100}
      OPS_PODCI_URL: ${OPS_PODCI_URL:-}
      RELEASE_SHA: ${RELEASE_SHA:-}
      DEPLOYED_AT: ${DEPLOYED_AT:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - uploads:/data/uploads
    expose:
      - "8000"
    # Healthcheck comes from the image (GET /api/v1/health); repeated here so `depends_on` is explicit.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4); sys.exit(0 if r.status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    # uvicorn gets 30 s to finish in-flight requests; running solver jobs are interrupted (README.md).
    stop_grace_period: 40s
    <<: *hardening
    deploy:
      resources:
        limits:
          cpus: "${BACKEND_CPUS:-4}"
          memory: ${BACKEND_MEMORY:-4g}
    logging: *default-logging

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: node:22.23.3-alpine3.24@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000}
    image: smartsched-frontend:${SMARTSCHED_TAG:-0.1.0}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --spider http://127.0.0.1:3000/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    <<: *hardening
    deploy:
      resources:
        limits:
          cpus: "${FRONTEND_CPUS:-1}"
          memory: ${FRONTEND_MEMORY:-1g}
    logging: *default-logging

  proxy:
    # Unprivileged build of the official nginx image: runs as uid 101 and listens on 8080.
    image: nginxinc/nginx-unprivileged:1.28.2-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "${PROXY_BIND:-0.0.0.0}:${PROXY_PORT:-8080}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    <<: *hardening
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: ${PROXY_MEMORY:-256m}
    logging: *default-logging

  # ---- optional legacy classroombookings (CRBS) so the live app can be imported from -------------
  crbs-db:
    profiles: ["legacy"]
    image: mysql:8.4.11@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
    restart: unless-stopped
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${CRBS_DB_ROOT_PASSWORD:?set CRBS_DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${CRBS_DB_NAME:-crbs}
      MYSQL_USER: ${CRBS_DB_USER:-crbs}
      MYSQL_PASSWORD: ${CRBS_DB_PASSWORD:?set CRBS_DB_PASSWORD in .env}
    volumes:
      - crbs-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    <<: *hardening
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    logging: *default-logging

  crbs:
    profiles: ["legacy"]
    build:
      context: ../..
      dockerfile: smartsched/deploy/legacy/Dockerfile
      args:
        PHP_IMAGE: php:8.3.35-apache-bookworm@sha256:b79a53c3fb1dd4b9f350a8d99d84951512b6c21044e61bbecfee8af030b3722e
    image: smartsched-crbs:${SMARTSCHED_TAG:-0.1.0}
    restart: unless-stopped
    depends_on:
      crbs-db:
        condition: service_healthy
    environment:
      CRBS_DB_HOST: crbs-db
      CRBS_DB_NAME: ${CRBS_DB_NAME:-crbs}
      CRBS_DB_USER: ${CRBS_DB_USER:-crbs}
      CRBS_DB_PASSWORD: ${CRBS_DB_PASSWORD}
    volumes:
      # The PHP code is baked into the image (non-root, port 8080). local/ (install marker, sessions,
      # logs, config.php) and uploads/ persist in named volumes, initialised from the image on first use.
      - crbs-local:/var/www/html/local
      - crbs-uploads:/var/www/html/uploads
    ports:
      - "${CRBS_BIND:-127.0.0.1}:${CRBS_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    <<: *hardening
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
    logging: *default-logging

  # ---- optional observability (profile "observability"; observability/README.md) ---------------------------
  # Internal network only: no ports. Grafana is reached through the proxy at /grafana/ after the SmartSched admin
  # check (forward-auth to /api/v1/ops/grafana-auth); Grafana trusts the proxy's X-WEBAUTH-USER header.
  # Memory caps total 768 MiB (Prometheus 192 + Loki 160 + Grafana 320 + Alloy 96; Grafana 13 needs ~240 MiB at start,
  # 192 MiB was OOM-killed in the measurement run); GOMEMLIMIT keeps each Go runtime under its cap.
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-1GB}
      - --web.enable-remote-write-receiver
    environment:
      GOMEMLIMIT: 160MiB
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    read_only: true
    cap_drop: [ALL]
    <<: *hardening
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: ${PROMETHEUS_MEMORY:-192m}
    logging: *default-logging

  loki:
    profiles: ["observability"]
    build:
      context: ./observability/loki
      dockerfile: Dockerfile
      args:
        LOKI_IMAGE: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
        BUSYBOX_IMAGE: busybox:1.37.0-musl@sha256:5cec3fc171c87218698e85a52af7087de727372aae264a787b8112901a5b0092
    image: smartsched-loki:${SMARTSCHED_TAG:-0.1.0}
    restart: unless-stopped
    environment:
      GOMEMLIMIT: 130MiB
    volumes:
      - loki-data:/loki
    expose:
      - "3100"
    healthcheck:
      test: ["CMD", "/usr/local/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    <<: *hardening
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: ${LOKI_MEMORY:-160m}
    logging: *default-logging

  alloy:
    profiles: ["observability"]
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
    environment:
      GOMEMLIMIT: 80MiB
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-smartsched}
      PG_DSN: postgresql://${POSTGRES_USER:-smartsched}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smartsched}?sslmode=disable
    # root inside the container only to read the json-file logs (/var/lib/docker/containers is 0700 root):
    # every capability dropped except DAC_OVERRIDE (needed to read those files and to write its own data volume,
    # whose directory belongs to the image's alloy user); every host mount is read-only, the root filesystem too
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - /var/lib/smartsched/textfile:/host/textfile:ro
    expose:
      - "12345"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    <<: *hardening
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: ${ALLOY_MEMORY:-96m}
    logging: *default-logging

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GOMEMLIMIT: 250MiB
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ENFORCE_DOMAIN: "false"
      # no Grafana login: the edge lets only SmartSched admins through and names them in X-WEBAUTH-USER
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Editor
      GF_USERS_DEFAULT_LANGUAGE: tr-TR
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_LOG_MODE: console
      GF_LOG_LEVEL: warn
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana-dashboards:ro
      - grafana-data:/var/lib/grafana
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/grafana/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    cap_drop: [ALL]
    <<: *hardening
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: ${GRAFANA_MEMORY:-320m}
    logging: *default-logging

volumes:
  pgdata:
  uploads:
  crbs-mysql:
  crbs-local:
  crbs-uploads:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
