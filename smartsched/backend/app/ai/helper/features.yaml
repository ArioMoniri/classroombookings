# SmartSched feature index ("Nerede?" / "Where is it?"), HB-01.
#
# One entry per page, tab or control a person can be sent to. The helper searches it with Turkish-folded BM25
# (app/ai/helper/index.py) and never shows an entry the person cannot open: `permission` is any-of, exactly as the
# frontend nav (`nav-config.ts`, `admin/nav-items.ts`, `lib/permissions.ts` ADMIN_SECTIONS, `wave1-sections.ts`);
# an empty list means every signed-in person. tests/helper/test_hb_01_index.py fails when a nav href has no entry,
# when the permissions differ, or when a route has no page.tsx.
#
# Fields: id, kind (page | tab | setting | control), route (a page path, optionally with #section), title / path / synonyms /
# steps in Turkish and English, anchor (a data-tour id from welcome-guide.md §13 or helper.md §3.4), permission
# (any-of), hide_with (hidden for holders of this permission, like NavItem.hideWith), actions (helper registry
# actions reachable from the entry), since (release).
#
# Synonyms carry the words people already use, CRBS words first (helper.md §3.2).

