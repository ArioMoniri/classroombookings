[project]
name = "smartsched-backend"
version = "0.1.0"
description = "SmartSched: AI classroom optimizer & scheduler backend (FastAPI, SQLAlchemy 2, OR-Tools CP-SAT)"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "aiosqlite>=0.20",
  "psycopg[binary]>=3.1",
  "greenlet>=3.0",
  "openpyxl>=3.1",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "PyJWT>=2.8",
  "argon2-cffi>=23.1",
  "cryptography>=42",
  "ortools>=9.10",
  "anthropic>=0.40",
  "python-docx>=1.1",
  "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"alembic/*" = ["E501", "I"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
no_implicit_optional = true

# app.solver.* (except the frozen contract and the greedy stub) is owned by the solver-engineer and
# gated by its own mypy run; errors there are ignored here so the backend gate stays independent.
[[tool.mypy.overrides]]
module = ["app.solver", "app.solver.*"]
ignore_errors = true
follow_imports = "skip"

# app.ai.* is owned by the ai-engineer (own gate, see app/ai/README.md "Tests"); the studio services
# import it, so errors there are ignored here (same policy as app.solver).
[[tool.mypy.overrides]]
module = ["app.ai", "app.ai.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["app.solver.model", "app.solver.stub"]
ignore_errors = false
follow_imports = "normal"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = [
  "ignore::UserWarning:openpyxl",
]
