[project]
name = "smartsched-backend"
version = "0.1.0"
description = "SmartSched: AI classroom optimizer & scheduler backend (FastAPI, SQLAlchemy 2, OR-Tools CP-SAT)"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "aiosqlite>=0.20",
  "psycopg[binary]>=3.1",
  "greenlet>=3.0",
  "openpyxl>=3.1",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "PyJWT>=2.8",
  "argon2-cffi>=23.1",
  "cryptography>=42",
  "ortools>=9.10",
  "anthropic>=0.40",
  "python-docx>=1.1",
  "pypdf>=4.0",
  "ldap3>=2.9",
  "Pillow>=10.0",  # uploaded logos / room photos are decoded and re-encoded (app/core/images.py)
  "bcrypt>=4.0",  # legacy CRBS password hashes ($2y$ / sha1:) verified once, then rehashed to argon2
  # Phase 19 intake parsers (docs/review/2026-10-15-phase19-engineering.md P19-Q3); exact versions in requirements.lock
  "xlrd>=2.0.1",  # legacy .xls only
  "defusedxml>=0.7.1",  # .ods content.xml and XML / SpreadsheetML 2003 without DTDs or entities
  "pdfplumber>=0.11",  # PDF tables (text PDFs)
  "pypdfium2>=4.30",  # scanned PDF pages rendered for the vision transcription
  "icalendar>=6.0",  # .ics intake (and the calendar-feed tests)
  # notification channels (docs/product/2026-10-15-integrations-options.md): delivery through the institution's
  # senders; pinned because the URL schemes and the RFC 8291 encoding are the contract
  "apprise==2.0.1",  # BSD-2-Clause: Telegram, WhatsApp Cloud, Twilio / Vonage SMS, Teams Workflows, Slack
  "pywebpush==2.5.0",  # MPL-2.0 (used unmodified as a library): Web Push payload encryption + VAPID
  # Microsoft Entra ID sign-in (app/services/sso.py; owner decision 2026-10-15); exact versions in requirements.lock
  "authlib>=1.9.1,<2",  # OIDC client, PKCE (BSD-3-Clause)
  "joserfc>=1.6.8,<2",  # ID token / JWKS verification, Authlib's JOSE library (BSD-3-Clause)
  # W3-OPS observability (app/core/observability.py): /metrics for Prometheus, multiprocess-safe (Apache-2.0)
  "prometheus-client>=0.26,<1",
]

[project.optional-dependencies]
# W3-IDP: SAML 2.0 sign-in (app/services/identity/saml.py) verifies XML signatures with signxml (Apache-2.0, pure
# Python on lxml + cryptography). Optional: without it SAML providers show "kütüphane gerekli" and cannot be enabled.
saml = ["signxml>=5.1,<6"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"alembic/*" = ["E501", "I"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
no_implicit_optional = true

# app.solver.* (except the frozen contract and the greedy stub) is owned by the solver-engineer and
# gated by its own mypy run; errors there are ignored here so the backend gate stays independent.
[[tool.mypy.overrides]]
module = ["app.solver", "app.solver.*"]
ignore_errors = true
follow_imports = "skip"

# app.ai.* is part of the backend gate since the 2026-10-08 review (MINOR 13): lint + types in make check.

[[tool.mypy.overrides]]
module = ["app.solver.model", "app.solver.stub"]
ignore_errors = false
follow_imports = "normal"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "slow: heavy real-workbook tests (>~15 s); `make check` skips them, `make test-slow` / CI runs them",
]
filterwarnings = [
  "ignore::UserWarning:openpyxl",
  "ignore::DeprecationWarning:ldap3.*",
]
