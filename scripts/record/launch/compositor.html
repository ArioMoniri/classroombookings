<!doctype html>
<!-- SmartSched launch video compositor. render.mjs opens this page in headless Chromium, calls draw(state) once per
     output frame and screenshots the result. The page holds no timing logic: every position, opacity and frame
     number comes from render.mjs, so a frame depends only on its state (deterministic, re-renderable).
     Licence: same as the repository. Original work. -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --fg:#0F172A; --muted:#475569; --primary:#2563EB; --navy:#1E3A8A; }
  html,body { margin:0; padding:0; overflow:hidden; background:#EEF2FA; }
  body { font-family: "Inter", "Inter Display", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #stage { position:absolute; left:0; top:0; overflow:hidden; }
  #bg { position:absolute; inset:0;
    background:
      radial-gradient(120% 90% at 12% 8%, #FFFFFF 0%, rgba(255,255,255,0) 55%),
      radial-gradient(90% 80% at 92% 96%, #C7D7FE 0%, rgba(199,215,254,0) 60%),
      linear-gradient(135deg, #E6EDFF 0%, #F3EEFB 100%); }
  #grid { position:absolute; inset:0; opacity:.5;
    background-image: linear-gradient(rgba(37,99,235,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(37,99,235,.06) 1px, transparent 1px);
    background-size: 48px 48px; mask-image: radial-gradient(80% 70% at 50% 50%, #000 0%, transparent 100%); }
  .layer { position:absolute; left:0; top:0; transform-origin: 50% 50%; will-change: transform, opacity; }
  .card { position:absolute; overflow:hidden; background:#fff;
    box-shadow: 0 2px 6px rgba(15,23,42,.08), 0 24px 64px -12px rgba(30,58,138,.35), 0 0 0 1px rgba(15,23,42,.06); }
  .card img { position:absolute; left:0; top:0; image-rendering: auto; }
  .phone { position:absolute; background:#0B1220; box-shadow: 0 30px 80px -20px rgba(15,23,42,.55), inset 0 0 0 2px #334155; }
  .phone .screen { position:absolute; overflow:hidden; background:#fff; }
  .phone .status { position:absolute; left:0; right:0; top:0; display:flex; align-items:center; justify-content:space-between;
    font-weight:600; color:#0F172A; background:#fff; }
  .phone .island { position:absolute; background:#0B1220; border-radius:999px; }
  .cursor { position:absolute; left:0; top:0; width:30px; height:30px; transform-origin: 3px 2px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
  .ripple { position:absolute; border-radius:50%; border:3px solid #2563EB; background:rgba(37,99,235,.18); }
  .tap { position:absolute; border-radius:50%; background:rgba(15,23,42,.28); border:3px solid rgba(255,255,255,.95); box-shadow: 0 0 0 2px rgba(37,99,235,.55); }
  .caption { position:absolute; left:50%; transform:translateX(-50%); white-space:nowrap; color:#fff; background:rgba(15,23,42,.88);
    font-weight:600; letter-spacing:-.01em; border-radius:999px; box-shadow: 0 10px 30px -8px rgba(15,23,42,.45);
    backdrop-filter: blur(8px); }
  .caption.wrap { white-space:normal; text-align:center; }
  .keys { position:absolute; display:flex; gap:8px; align-items:center; }
  .kbd { color:#0F172A; background:#fff; border:1px solid #CBD5E1; border-bottom-width:3px; border-radius:10px; font-weight:600;
    font-family: "JetBrains Mono", ui-monospace, monospace; box-shadow: 0 6px 16px -6px rgba(15,23,42,.35); }
  .chip { position:absolute; display:flex; align-items:center; gap:10px; font-weight:600; color:#1E3A8A;
    background:rgba(255,255,255,.82); border:1px solid rgba(37,99,235,.18); border-radius:999px; backdrop-filter: blur(10px);
    box-shadow: 0 6px 20px -10px rgba(30,58,138,.45); }
  .chip b { display:inline-flex; align-items:center; justify-content:center; color:#fff; background:#2563EB; border-radius:999px; }
  .title { position:absolute; color:#0F172A; font-weight:700; letter-spacing:-.025em; line-height:1.05; }
  .title small { display:block; font-weight:500; color:#475569; letter-spacing:-.01em; line-height:1.3; }
  .lottie { position:absolute; overflow:hidden; border-radius:28px; box-shadow: 0 24px 64px -16px rgba(30,58,138,.35); }
  .lottie > div { width:100%; height:100%; }
  .logo { position:absolute; }
</style>
</head>
<body>
<div id="stage"><div id="bg"></div><div id="grid"></div><div id="layers"></div></div>
<script>
const CURSOR_SVG = `<svg viewBox="0 0 30 30" width="30" height="30"><path d="M3 2 L3 23 L8.6 17.8 L12.4 26.6 L16.2 25 L12.5 16.3 L20 16.3 Z" fill="#0F172A" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
const imgs = new Map(); // src -> {img, ready: Promise, used}
let useTick = 0;
function image(src) {
  let e = imgs.get(src);
  if (!e) {
    const img = new Image();
    img.decoding = "sync";
    img.src = src;
    e = { img, ready: img.decode().catch(() => undefined), used: 0 };
    imgs.set(src, e);
  }
  e.used = ++useTick;
  if (imgs.size > 10) {
    const old = [...imgs.entries()].sort((a, b) => a[1].used - b[1].used).slice(0, imgs.size - 10);
    for (const [k] of old) imgs.delete(k);
  }
  return e;
}
/** Warm the cache: decode frames the next draws will need. */
window.preload = (srcs) => Promise.all(srcs.map((s) => image(s).ready));

const anims = {}; // name -> lottie instance (svg renderer, vector: crisp at any size)
window.loadLottie = (name, data) => new Promise((ok, fail) => {
  const holder = document.createElement("div");
  holder.className = "lottie"; holder.style.display = "none";
  const inner = document.createElement("div"); holder.appendChild(inner);
  document.getElementById("stage").appendChild(holder);
  const a = lottie.loadAnimation({ container: inner, renderer: "svg", loop: false, autoplay: false, animationData: data,
    rendererSettings: { preserveAspectRatio: "xMidYMid slice", progressiveLoad: false } });
  a.addEventListener("DOMLoaded", () => { anims[name] = { a, holder }; ok(a.totalFrames); });
  a.addEventListener("data_failed", () => fail(new Error("lottie data_failed " + name)));
});

const px = (v) => `${Math.round(v * 100) / 100}px`;
function el(tag, cls, parent, style = {}) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  Object.assign(e.style, style);
  parent.appendChild(e);
  return e;
}

/** Inner content of a screen: the captured frame through the camera, the cursor, ripples, taps. */
function screenContent(L, box, parent) {
  const s = box.w / L.cam.w; // output px per CSS px of the take
  // the cached element itself, already decoded (draw() awaits it): a new <img> with the same src decodes again on its
  // own schedule, and a screenshot taken before that showed a blank screen for a frame
  const e = image(L.src);
  const im = e.img.isConnected ? e.img.cloneNode() : e.img;
  im.className = "";
  im.removeAttribute("style");
  Object.assign(im.style, { width: px(L.srcW * s), height: px(L.srcH * s), transform: `translate(${px(-L.cam.x * s)}, ${px(-L.cam.y * s)})` });
  parent.appendChild(im);
  const to = (p) => ({ x: (p.x - L.cam.x) * s, y: (p.y - L.cam.y) * s });
  for (const r of L.ripples ?? []) {
    const p = to(r); const u = r.age; const d = (24 + 70 * u) * Math.max(1, s * 0.9);
    el("div", "ripple", parent, { left: px(p.x - d / 2), top: px(p.y - d / 2), width: px(d), height: px(d), opacity: String(Math.max(0, 1 - u) * 0.95) });
  }
  for (const t of L.taps ?? []) {
    const p = to(t); const u = t.age; const d = (44 + 30 * u) * Math.max(1, s * 0.8);
    el("div", "tap", parent, { left: px(p.x - d / 2), top: px(p.y - d / 2), width: px(d), height: px(d), opacity: String(Math.max(0, 1 - u * u)) });
  }
  if (L.cursor) {
    const p = to(L.cursor); const sc = (L.cursorScale ?? 1.25) * (L.cursor.pressed ? 0.86 : 1);
    const c = el("div", "cursor", parent, { transform: `translate(${px(p.x - 3)}, ${px(p.y - 2)}) scale(${sc})` });
    c.innerHTML = CURSOR_SVG;
  }
}

function drawLayer(L, root) {
  const g = el("div", "layer", root, { width: px(window.__W), height: px(window.__H), opacity: String(L.opacity ?? 1),
    transform: L.transform ?? "none", filter: L.blur ? `blur(${px(L.blur)})` : "none" });
  if (L.kind === "screen") {
    const b = L.box;
    const card = el("div", "card", g, { left: px(b.x), top: px(b.y), width: px(b.w), height: px(b.h), borderRadius: px(L.radius ?? 18) });
    screenContent(L, b, card);
  } else if (L.kind === "phone") {
    const b = L.box; const k = b.w / 390; // bezel scale
    const bez = 14 * k; const status = 44 * k;
    const ph = el("div", "phone", g, { left: px(b.x - bez), top: px(b.y - bez - status), width: px(b.w + 2 * bez), height: px(b.h + 2 * bez + status), borderRadius: px(58 * k) });
    const scr = el("div", "screen", ph, { left: px(bez), top: px(bez), width: px(b.w), height: px(b.h + status), borderRadius: px(46 * k) });
    const st = el("div", "status", scr, { height: px(status), padding: `0 ${px(30 * k)}`, fontSize: px(15 * k) });
    st.innerHTML = `<span>09:41</span><span style="letter-spacing:${px(2 * k)}">▮▮▮ ◔</span>`;
    el("div", "island", scr, { left: px(b.w / 2 - 60 * k), top: px(10 * k), width: px(120 * k), height: px(32 * k) });
    const inner = el("div", "", scr, { position: "absolute", left: "0", top: px(status), width: px(b.w), height: px(b.h), overflow: "hidden" });
    screenContent(L, { x: 0, y: 0, w: b.w, h: b.h }, inner);
  } else if (L.kind === "lottie") {
    const A = anims[L.name];
    if (A) {
      A.holder.style.display = "block";
      Object.assign(A.holder.style, { left: px(L.box.x), top: px(L.box.y), width: px(L.box.w), height: px(L.box.h), opacity: String(L.opacity ?? 1),
        transform: L.transform ?? "none", borderRadius: px(L.radius ?? 28), boxShadow: L.flat ? "none" : "" });
      A.a.resize();
      A.a.goToAndStop(L.frame, true);
      A.holder.dataset.used = "1";
    }
  } else if (L.kind === "html") {
    const h = el("div", L.cls ?? "", g, L.style ?? {});
    h.innerHTML = L.html;
  }
  return g;
}

window.draw = async (S) => {
  window.__W = S.W; window.__H = S.H;
  const stage = document.getElementById("stage");
  stage.style.width = px(S.W); stage.style.height = px(S.H);
  const root = document.getElementById("layers");
  root.innerHTML = "";
  for (const A of Object.values(anims)) A.holder.dataset.used = "";
  const waits = [];
  for (const L of S.layers) {
    if (L.src) waits.push(image(L.src).ready);
    drawLayer(L, root);
  }
  for (const A of Object.values(anims)) if (!A.holder.dataset.used) A.holder.style.display = "none";
  if (S.preload) for (const s of S.preload) image(s);
  await Promise.all(waits);
  // every image on the stage (take frames, clones, the logo) decoded before the screenshot paints it
  await Promise.all([...root.querySelectorAll("img")].map((i) => (i.complete && i.naturalWidth ? undefined : i.decode().catch(() => undefined))));
  // no requestAnimationFrame here: a page that is not the focused tab gets no animation frames (several render
  // workers share one browser); the screenshot itself forces the paint
  return true;
};
</script>
</body>
</html>
