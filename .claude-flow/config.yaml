# Ruflo (formerly Claude Flow) runtime configuration for this repository - developer harness only.
# See docs/universal/RUFLO.md. Generated by `ruflo@3.55.0 init`, then reduced to safe values:
# no hooks, no auto-execution, no background daemon, no self-learning or neural training, and the
# MCP server is not started automatically. The production backend does NOT use Ruflo
# (docs/universal/RESEARCH-2026.md §1.6).

version: "3.0.0"

swarm:
  # the orchestrator (queen) plans; builders work in disjoint directories (docs/AGENTS.md)
  topology: hierarchical
  maxAgents: 8
  autoScale: false
  coordinationStrategy: centralized

memory:
  backend: sqlite
  enableHNSW: false
  persistPath: .claude-flow/data
  cacheSize: 100
  learningBridge:
    enabled: false
  memoryGraph:
    enabled: false
  agentScopes:
    enabled: true
    defaultScope: project

neural:
  enabled: false

hooks:
  enabled: false
  autoExecute: false

daemon:
  autoStart: false

mcp:
  autoStart: false
  port: 3000
