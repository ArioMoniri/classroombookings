# SmartSched AWS pod: up / status / stop / start / down / cost via infra/aws/smartsched_aws.py.
#
# The ONLY GitHub Actions workflow that runs automatically, and only when infra/aws/POD_ACTION changes
# (workflow_dispatch needs the default branch, which we do not push to). All CI runs ON the pod
# (smartsched/deploy/pod-ci); this job only calls AWS APIs: no builds, no tests, <= 10 minutes.
#
# Trigger: commit + push a change to infra/aws/POD_ACTION whose first line is
#     up | status | logs | stop | start | cost | resize | ci-upgrade | down destroy
#     (`resize type=<instance type> budget=<usd>` stops the pod, changes its type, starts it and sets the budget;
#      `ci-upgrade` reinstalls pod CI on the pod from its deploy branch through SSM and restarts the worker)
#     (optional: region=<aws-region>, pod=gracious|universal or branch=<deploy branch>; default pod gracious)
#     `up` also takes deploy-time settings as key=value (quote values with spaces), mapped to the
#     `smartsched_aws.py up` flags of docs/deploy/ONE-CLICK.md: org= admin= acme= ai= ai-base-url= smtp-host=
#     smtp-port= smtp-security= smtp-user= smtp-from= smtp-from-name= security= observability=on|off.
#     domain= is refused: the AWS pod's domain is always <elastic-ip>.sslip.io.
#     e.g. `echo "up pod=universal org=\"Örnek Üniversitesi\" admin=it@uni.edu.tr $(date -u +%FT%TZ)" > infra/aws/POD_ACTION`
# Optional repo secrets AI_API_KEY, SMTP_PASSWORD, GOOGLE_CLIENT_ID/_SECRET, MICROSOFT_CLIENT_ID/_SECRET/_TENANT
# reach `up` as environment variables only (stored as SSM SecureString / String; values never printed).
# e.g. `echo "up $(date -u +%FT%TZ)" > infra/aws/POD_ACTION` (the timestamp makes every push a change), or
#      `echo "up pod=universal $(date -u +%FT%TZ)" > infra/aws/POD_ACTION` for the empty (universal) deploy.
# `down` deletes the pod and its data; it needs the second word `destroy` (`down destroy pod=universal`).
# Each pod has its own instance, names (smartsched-<pod>-*), SSM prefix (/smartsched, /smartsched-universal) and
# budget; what its first deploy loads comes from its branch's smartsched/deploy/profile.env.
#
# Credentials (preferred first):
#   1. secret AWS_ROLE_ARN -> GitHub OIDC role (role-to-assume, id-token: write); no keys stored.
#      Created by aws-oidc-bootstrap.yml; see docs/deploy/AWS-OIDC.md and docs/deploy/AWS.md.
#   2. otherwise access keys from secrets (names configurable on manual dispatch):
#      AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN (temporary STS keys).
# The job fails fast with a clear message when the credentials are expired (sts get-caller-identity).
# It never prints secret values: only the panel URL and SSM parameter NAMES.
name: aws-bootstrap

on:
  push:
    paths:
      - "infra/aws/POD_ACTION"
  workflow_dispatch:
    inputs:
      command:
        description: "up | status | stop | start | cost | down"
        type: choice
        options: [status, logs, up, stop, start, cost, down]
        default: status
      confirm_down:
        description: "type destroy to allow `down`"
        type: string
        default: ""
      settings:
        description: "deploy-time settings for `up`, as on the POD_ACTION line (e.g. org=\"Örnek Üniversitesi\" admin=it@uni.edu.tr)"
        type: string
        default: ""
      pod:
        description: "which pod (gracious = imported institution data, universal = empty setup wizard)"
        type: choice
        options: [gracious, universal]
        default: gracious
      region:
        description: "AWS region ('' = AWS_REGION/AWS_DEFAULT_REGION secret, else us-east-1; 'auto' = cheaper of eu-central-1/eu-south-1)"
        type: string
        default: ""
      access_key_secret:
        description: "name of the secret holding the access key id (fallback when AWS_ROLE_ARN is unset)"
        type: string
        default: AWS_ACCESS_KEY_ID
      secret_key_secret:
        description: "name of the secret holding the secret access key"
        type: string
        default: AWS_SECRET_ACCESS_KEY
      session_token_secret:
        description: "name of the secret holding the session token (optional)"
        type: string
        default: AWS_SESSION_TOKEN

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-bootstrap
  cancel-in-progress: false

jobs:
  pod:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      REGION_SECRET: ${{ secrets.AWS_REGION || secrets.AWS_DEFAULT_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the seed tool lets `up` check the deploy-time settings before any AWS call
          sparse-checkout: |
            infra/aws
            smartsched/deploy/seed
          persist-credentials: false

      - name: Resolve command
        id: cmd
        env:
          DISPATCH_COMMAND: ${{ inputs.command }}
          DISPATCH_CONFIRM: ${{ inputs.confirm_down }}
          DISPATCH_REGION: ${{ inputs.region }}
          DISPATCH_POD: ${{ inputs.pod }}
          DISPATCH_SETTINGS: ${{ inputs.settings }}
        run: |
          set -euo pipefail
          settings=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            cmd="$DISPATCH_COMMAND"; confirm="$DISPATCH_CONFIRM"; region="$DISPATCH_REGION"; pod="$DISPATCH_POD"
            settings="${DISPATCH_SETTINGS:-}"
          else
            line="$(head -n1 infra/aws/POD_ACTION 2>/dev/null || true)"
            read -r cmd confirm _ <<< "$line" || true
            region="$(grep -oE 'region=[a-z0-9-]+' <<< "$line" | cut -d= -f2 || true)"
            pod="$(grep -oE '(pod|branch)=[A-Za-z0-9._/-]+' <<< "$line" | head -n1 | cut -d= -f2 || true)"
            settings="$line"
          fi
          case "${pod:-gracious}" in
            gracious|claude/gracious-cerf-w1598m) pod=gracious ;;
            universal|claude/smartsched-universal) pod=universal ;;
            *) echo "::error::unknown pod '$pod' (gracious | universal, or their branches)"; exit 1 ;;
          esac
          case "$cmd" in
            up|status|logs|stop|start|cost|resize|ci-upgrade) ;;
            down)
              if [ "$confirm" != "destroy" ]; then
                echo "::error::'down' deletes the pod and its data; write 'down destroy' into infra/aws/POD_ACTION"
                exit 1
              fi ;;
            *) echo "::error::unknown command '$cmd' (up|status|logs|stop|start|cost|resize|ci-upgrade|down destroy)"; exit 1 ;;
          esac
          region="${region:-${REGION_SECRET:-us-east-1}}"
          if ! [[ "$region" =~ ^[a-z0-9-]+$ ]]; then echo "::error::invalid region '$region'"; exit 1; fi
          # deploy-time settings -> `up` flags, NUL-separated (argv, never eval); only the flag names are logged
          python3 - "$cmd" "$settings" "${RUNNER_TEMP:-$PWD}/pod-flags" <<'PY'
          import re, shlex, sys
          cmd, line, out = sys.argv[1], sys.argv[2], sys.argv[3]
          FLAGS = {"org": "--org-name", "admin": "--admin-email", "acme": "--acme-email", "ai": "--ai-provider",
                   "ai-provider": "--ai-provider", "ai-base-url": "--ai-base-url", "smtp-host": "--smtp-host",
                   "smtp-port": "--smtp-port", "smtp-security": "--smtp-security", "smtp-user": "--smtp-user",
                   "smtp-from": "--smtp-from", "smtp-from-name": "--smtp-from-name", "security": "--security-contact",
                   "security-contact": "--security-contact"}
          ROUTING = {"region", "pod", "branch"}
          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)
          try:
              words = shlex.split(line)
          except ValueError as exc:
              fail(f"cannot parse the settings ({exc}); quote values with spaces in double quotes")
          resize = cmd == "resize"
          if resize:
              # only the instance type and the budget; everything else on the line is ignored
              args = []
              for w in words[1:]:
                  key, _, value = w.partition("=")
                  if key.lower() == "type" and re.fullmatch(r"[a-z0-9]+\.[a-z0-9]+", value):
                      args += ["--instance-type", value]
                  elif key.lower() == "budget" and re.fullmatch(r"[0-9]+(\.[0-9]+)?", value):
                      args += ["--budget-usd", value]
              if "--instance-type" not in args:
                  fail("resize needs type=<instance type>, e.g. resize type=c7g.4xlarge budget=450")
          args = [] if not resize else args
          for w in ([] if resize else words[1:]):
              if "=" not in w:
                  continue  # the confirm word, the timestamp
              key, value = w.split("=", 1)
              key = key.lower()
              if key in ROUTING:
                  continue
              if key == "domain":
                  fail("domain= is not supported on the AWS pod: its domain is always <elastic-ip>.sslip.io "
                       "(docs/deploy/ONE-CLICK.md); use deploy.sh --domain on your own server")
              if any(c in value for c in "\r\n\0"):
                  fail(f"{key}= holds a control character")
              if key == "observability":
                  if value.lower() not in ("on", "off", "1", "0", "true", "false"):
                      fail("observability=on|off")
                  args.append("--observability" if value.lower() in ("on", "1", "true") else "--no-observability")
              elif key in FLAGS:
                  if not value.strip():
                      fail(f"{key}= is empty")
                  args += [FLAGS[key], value.strip()]
              else:
                  fail(f"unknown setting '{key}' (org admin acme ai ai-base-url smtp-host smtp-port smtp-security "
                       "smtp-user smtp-from smtp-from-name security observability)")
          if cmd not in ("up", "resize"):
              if args:
                  print(f"::notice::deploy-time settings apply to 'up' only; ignored for '{cmd}'")
              args = []
          with open(out, "w", encoding="utf-8") as fh:
              fh.write("".join(a + "\0" for a in args))
          names = [a for a in args if a.startswith("--")]
          print("up flags: " + (" ".join(names) if names else "(none)"))
          PY
          # the AWS SDK needs a concrete region; `auto` is resolved by the script
          aws_region="$region"; if [ "$region" = "auto" ]; then aws_region=us-east-1; fi
          { echo "command=$cmd"; echo "pod=$pod"; echo "region=$region"; echo "aws_region=$aws_region"; } >> "$GITHUB_OUTPUT"
          echo "pod action: $cmd (pod $pod, region $region)"

      - name: AWS credentials (OIDC role)
        if: env.ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: smartsched-${{ steps.cmd.outputs.pod }}-${{ steps.cmd.outputs.command }}
          aws-region: ${{ steps.cmd.outputs.aws_region }}
          role-duration-seconds: 3600

      - name: AWS credentials (access keys)
        if: env.ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets[inputs.access_key_secret || 'AWS_ACCESS_KEY_ID'] }}
          aws-secret-access-key: ${{ secrets[inputs.secret_key_secret || 'AWS_SECRET_ACCESS_KEY'] }}
          aws-session-token: ${{ secrets[inputs.session_token_secret || 'AWS_SESSION_TOKEN'] }}
          aws-region: ${{ steps.cmd.outputs.aws_region }}

      - name: Install boto3 (pinned)
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet --disable-pip-version-check "$(grep -E '^boto3==' infra/aws/requirements.txt)" "$(grep -E '^botocore==' infra/aws/requirements.txt)"

      - name: Preflight (fails fast on expired or invalid credentials)
        env:
          AWS_REGION_NAME: ${{ steps.cmd.outputs.aws_region }}
        run: /tmp/venv/bin/python infra/aws/smartsched_aws.py preflight --region "$AWS_REGION_NAME" > /dev/null

      - name: Store POD_GITHUB_TOKEN in SSM (<pod prefix>/github_token, SecureString)
        if: steps.cmd.outputs.command == 'up'
        env:
          POD_GITHUB_TOKEN: ${{ secrets.POD_GITHUB_TOKEN }}
          POD_REGION: ${{ steps.cmd.outputs.region }}
          POD_NAME: ${{ steps.cmd.outputs.pod }}
        run: |
          if [ "$POD_REGION" = "auto" ]; then
            echo "::error::region=auto: pick the region explicitly for 'up' so the token lands next to the pod"; exit 1
          fi
          /tmp/venv/bin/python infra/aws/smartsched_aws.py put-github-token --from-env POD_GITHUB_TOKEN \
            --pod "$POD_NAME" --region "$POD_REGION" > /dev/null
          if [ -z "$POD_GITHUB_TOKEN" ]; then echo "::warning::POD_GITHUB_TOKEN is not set; the pod waits for /smartsched/github_token"; fi

      - name: smartsched_aws.py ${{ steps.cmd.outputs.command }}
        env:
          POD_COMMAND: ${{ steps.cmd.outputs.command }}
          POD_REGION: ${{ steps.cmd.outputs.region }}
          POD_NAME: ${{ steps.cmd.outputs.pod }}
          # optional repo secrets for `up` (empty = not set); smartsched_aws.py reads them from the environment
          # and stores them as SSM SecureString / String. Never echoed: GitHub masks them, the script logs names only.
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          MICROSOFT_TENANT: ${{ secrets.MICROSOFT_TENANT }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$POD_COMMAND" = "down" ]; then extra+=(--yes); fi
          # the deploy-time flags the Resolve step parsed from POD_ACTION (empty unless `up`)
          if { [ "$POD_COMMAND" = "up" ] || [ "$POD_COMMAND" = "resize" ]; } && [ -s "$RUNNER_TEMP/pod-flags" ]; then
            mapfile -d '' -t settings < "$RUNNER_TEMP/pod-flags"; extra+=("${settings[@]}")
          fi
          /tmp/venv/bin/python infra/aws/smartsched_aws.py "$POD_COMMAND" --pod "$POD_NAME" \
            --region "$POD_REGION" --output-json /tmp/result.json "${extra[@]}" > /dev/null
          cat /tmp/result.json

      - name: Summary (panel URL + SSM parameter names, never values)
        if: always()
        env:
          POD_COMMAND: ${{ steps.cmd.outputs.command }}
          POD_NAME: ${{ steps.cmd.outputs.pod }}
        run: |
          [ -f /tmp/result.json ] || exit 0
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          r = json.load(open("/tmp/result.json"))
          print(f"## SmartSched pod {os.environ['POD_NAME']}: {os.environ['POD_COMMAND']}\n")
          for key in ("panel_url", "region", "instance_id", "public_ip", "admin_email"):
              if r.get(key):
                  print(f"- **{key}**: `{r[key]}`")
          if r.get("read_admin_password"):
              print(f"- admin password: `{r['read_admin_password']}`")
          if r.get("panel_url"):
              print(f"- CI results: {r['panel_url']}/ci/ (admin login, or basic auth from `/smartsched/ci/basic_auth`)")
          params = r.get("parameters") or {}
          if params:
              print("\nSSM parameters (names only):\n")
              for k, v in params.items():
                  print(f"- {k}: `{v}`")
          est = r.get("estimate") or (r.get("estimated_monthly_usd") or {}).get("if_running_24x7")
          if est:
              print(f"\nEstimated monthly cost if running 24/7: **${est['total']}**")
          print("\n<details><summary>full result</summary>\n\n```json\n" + json.dumps(r, indent=2) + "\n```\n</details>")
          PY
