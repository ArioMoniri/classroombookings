name: smartsched

on:
  push:
    paths:
      - "smartsched/**"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/smartsched.yml"
  pull_request:
    paths:
      - "smartsched/**"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/smartsched.yml"
  workflow_dispatch:

concurrency:
  group: smartsched-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: smartsched/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: smartsched/backend/pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Backend gate (make check = ruff + mypy + pytest; parses the real fixture workbooks)
        run: make check
      - name: Solver gate (slow scale tests skipped unless SMARTSCHED_SLOW=1)
        run: |
          ruff check app/solver
          python -m mypy app/solver
          python -m pytest tests/solver -q
      - name: Alembic migrations apply on a fresh SQLite database
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-migrate.db
        run: alembic upgrade head

  frontend:
    name: frontend (tsc + eslint + vitest + playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: smartsched/frontend
    env:
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: smartsched/frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Frontend gate (npm run check = tsc + eslint + vitest)
        run: npm run check
      - name: Playwright version
        id: pw
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers (chromium + OS deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS deps only (browsers cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Playwright smoke (mock API; builds + starts next on :3100)
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            smartsched/frontend/playwright-report
            smartsched/frontend/test-results
          retention-days: 7

  docker:
    name: docker images (buildx, no push)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validate deploy files (compose config, env completeness, paths)
        run: pip install pyyaml && smartsched/deploy/validate.sh
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: smartsched/backend
          file: smartsched/backend/Dockerfile
          push: false
          load: false
          tags: smartsched-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: smartsched/frontend
          file: smartsched/frontend/Dockerfile
          push: false
          load: false
          tags: smartsched-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://backend:8000
            NEXT_PUBLIC_API_MOCK=0
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  watchdog:
    name: watchdog (agent ledger report, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Ledger report
        run: python scripts/watchdog.py --json || true
