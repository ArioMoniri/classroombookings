name: smartsched

# Quality gates for SmartSched (smartsched/**): backend ruff + mypy + pytest (+ migrations on SQLite
# and Postgres 16), frontend tsc + eslint + vitest + Playwright against the REAL backend (a backend
# container with the Bahar fixtures; there is no mock API), Docker image builds (no push), a full docker
# compose smoke test, and the agent watchdog report (non-blocking).

# DISABLED ON PUSH (2026-10-08, user decision: GitHub Actions minutes are too expensive).
# CI runs on the AWS pod itself (smartsched/deploy/pod-ci); this file is kept only as a manual fallback.
on:
  workflow_dispatch:

concurrency:
  group: smartsched-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: backend (ruff + mypy + pytest + migrations)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: smartsched/backend
    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_USER: smartsched
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: smartsched
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartsched -d smartsched"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: smartsched/backend/pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Backend gate (make check = ruff + mypy incl. app/api + app/ai + fast pytest on the real workbooks)
        run: make check
      - name: Backend slow tests (heaviest real-workbook tests, tests/conftest.py SLOW_TESTS)
        run: make test-slow
      - name: Solver gate (slow scale tests skipped unless SMARTSCHED_SLOW=1)
        run: |
          ruff check app/solver
          python -m mypy app/solver
          python -m pytest tests/solver -q
      - name: AI lint (tests/ai run inside make check unless the backend Makefile ignores them)
        run: |
          if [ -d app/ai ]; then ruff check app/ai; fi
          if grep -q -- '--ignore=tests/ai' Makefile && [ -d tests/ai ]; then python -m pytest tests/ai -q; fi
      - name: Migrations on a fresh SQLite database
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-migrate.db
        run: alembic upgrade head
      - name: Container entrypoint against Postgres 16 (migrate + seed + uvicorn + health + login)
        env:
          ENVIRONMENT: prod
          DATABASE_URL: postgresql+psycopg://smartsched:ci-only-password@127.0.0.1:5432/smartsched
          APP_SECRET: ci-only-app-0123456789abcdef0123456789abcdef01
          JWT_SECRET: ci-only-jwt-0123456789abcdef0123456789abcdef01
          ADMIN_EMAIL: admin@example.edu.tr
          ADMIN_PASSWORD: ci-only-admin-password
          UPLOAD_DIR: /tmp/smartsched-uploads
          UVICORN_WORKERS: "2"
        run: |
          sh ./docker-entrypoint.sh > /tmp/backend.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/api/v1/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/v1/health | grep -q '"db":true'
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -H 'content-type: application/json' \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}" | grep -q access_token
          # second start is idempotent (alembic no-op, seed no-op)
          sh ./docker-entrypoint.sh python -c "print('restart ok')"
      - name: Backend log
        if: always()
        run: cat /tmp/backend.log || true

  frontend:
    name: frontend (tsc + eslint + vitest + playwright on the real backend)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: smartsched/frontend
    env:
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
      CI: "1"
      E2E_REAL: "1"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - name: Start the e2e backend container (Bahar fixtures, seeded admin, full-term run, pinned booking clock)
        working-directory: .
        run: |
          docker run -d --name e2e-backend --network host \
            -v "$GITHUB_WORKSPACE:/w/src" -v "$RUNNER_TEMP/e2e:/w/e2e" -w /w/src/smartsched/backend \
            -e E2E_WORKDIR=/w/e2e -e E2E_HOST=127.0.0.1 -e E2E_PORT=8000 -e E2E_BOOKING_CLOCK=2026-02-16T08:00 \
            python:3.12.15-slim-bookworm bash /w/src/smartsched/deploy/pod-ci/gates/e2e-backend-entry.sh
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: smartsched/frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Frontend gate (npm run check = tsc + eslint + vitest)
        run: npm run check
      - name: Playwright version (locked by package-lock.json)
        id: pw
        run: |
          installed=$(node -p "require('@playwright/test/package.json').version")
          locked=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          test "$installed" = "$locked"
          echo "version=$installed" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers (chromium + OS deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS deps only (browsers cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Wait for the e2e backend
        run: |
          for i in $(seq 1 300); do
            curl -fsS http://127.0.0.1:8000/api/v1/health >/dev/null && exit 0
            docker ps -q -f name=e2e-backend | grep -q . || { docker logs e2e-backend; exit 1; }
            sleep 2
          done
          docker logs --tail 200 e2e-backend; exit 1
      - name: Playwright, every spec on the real backend (builds + starts next on :3100)
        run: npx playwright test
      - name: No mock/demo code in the production build
        run: bash ../deploy/validate.sh --no-mock-build .next/standalone
      - name: Backend log
        if: always()
        working-directory: .
        run: docker logs --tail 300 e2e-backend || true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            smartsched/frontend/playwright-report
            smartsched/frontend/test-results
          retention-days: 7

  docker:
    name: docker images (buildx, no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate deploy files (env completeness, pins, paths, shellcheck, compose config)
        run: |
          python -m pip install pyyaml
          smartsched/deploy/validate.sh
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: smartsched/backend
          file: smartsched/backend/Dockerfile
          push: false
          tags: smartsched-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: smartsched/frontend
          file: smartsched/frontend/Dockerfile
          push: false
          tags: smartsched-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://backend:8000
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Build legacy CRBS image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: smartsched/deploy/legacy/Dockerfile
          push: false
          tags: smartsched-crbs:ci
          cache-from: type=gha,scope=crbs
          cache-to: type=gha,scope=crbs,mode=max

  stack-smoke:
    name: docker compose smoke (deploy.sh up, login through nginx, down)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: docker
    defaults:
      run:
        working-directory: smartsched/deploy
    steps:
      - uses: actions/checkout@v4
      - name: deploy.sh (generates .env, builds, starts, waits for /api/v1/health)
        run: ADMIN_EMAIL=ci-admin@smartsched.invalid ./deploy.sh
      - name: Smoke checks through the proxy
        run: |
          set -euo pipefail
          get() { grep -E "^$1=" .env | cut -d= -f2-; }
          base="http://localhost:$(get PROXY_PORT)"
          curl -fsS "$base/healthz"
          curl -fsS "$base/api/v1/health" | grep -q '"db":true'
          curl -fsS -o /dev/null "$base/login"
          # API docs are off in prod (no-placeholder audit m6)
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/api/docs")" = 404
          # imported workbooks must not be public
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/uploads/imports/x.xlsx")" = 404
          # cookie login via the Next.js route handler, then an authenticated call
          curl -fsS -c /tmp/jar -X POST "$base/api/v1/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"email\":\"$(get ADMIN_EMAIL)\",\"password\":\"$(get ADMIN_PASSWORD)\"}"
          curl -fsS -b /tmp/jar "$base/api/v1/auth/me" | grep -q "$(get ADMIN_EMAIL)"
          # every long-running container is non-root
          for svc in backend frontend proxy; do
            uid=$(docker compose --env-file .env exec -T "$svc" id -u)
            echo "$svc uid=$uid"; test "$uid" != 0
          done
      - name: Compose logs
        if: always()
        run: docker compose --env-file .env logs --no-color --tail=300 || true
      - name: Tear down
        if: always()
        run: FORCE=1 ./deploy.sh --down --volumes || true

  watchdog:
    name: watchdog (agent ledger report, non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Ledger report (stale agents, last status per agent)
        run: python scripts/watchdog.py || true
      - name: Ledger report (JSON)
        run: python scripts/watchdog.py --json || true
