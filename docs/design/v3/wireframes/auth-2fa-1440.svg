<text x='560' y='680' font-size='11' font-weight='500' fill='#7C3AED' text-anchor='start'>Parola → bu adım: sayfa yan yana 220 ms, bulanıklık 0 (azaltılmış: 100 ms opaklık).</text>
<text x='560' y='700' font-size='11' font-weight='500' fill='#7C3AED' text-anchor='start'>'Başka bir yöntem' paneli: Panel reveal 240/160 ms, yerinde açılır.</text>
<text x='560' y='720' font-size='11' font-weight='500' fill='#7C3AED' text-anchor='start'>Hatırla: varsayılan kapalı; politika kapatırsa gizli. Yalnız ikinci adımı atlar.</text>
