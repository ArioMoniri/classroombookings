<text x='560' y='640' font-size='11' font-weight='500' fill='#7C3AED' text-anchor='start'>Tek gerçek &lt;input&gt; 6 slot olarak çizilir (input-otp, MIT): bir ad, bir sekme durağı, one-time-code, yapıştırma.</text>
