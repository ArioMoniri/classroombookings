<svg xmlns='http://www.w3.org/2000/svg' width='1440' height='900' viewBox='0 0 1440 900' font-family='-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif' role='img' aria-label='Uygulama içi iletiler: zil, bildirim (toast), uyarı bandı, boş durum'>
<title>Uygulama içi iletiler: zil, bildirim (toast), uyarı bandı, boş durum</title>
<rect width='1440' height='900' fill='#F4F6F9'/>
