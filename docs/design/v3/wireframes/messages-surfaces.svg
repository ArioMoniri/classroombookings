<text x='175.0' y='140.32' font-size='12' font-weight='500' fill='#0F172A' text-anchor='middle'>Okunmamış 2</text>
<rect x='235' y='120' width='76' height='32' rx='16.0' fill='#FFFFFF' fill-opacity='1' stroke='#94A3B8' stroke-width='1'/>
<text x='273.0' y='140.32' font-size='12' font-weight='500' fill='#0F172A' text-anchor='middle'>Onaylar</text>
<circle cx='76' cy='186' r='9' fill='#15803D'/>
<text x='96' y='190' font-size='13' font-weight='700' fill='#0F172A' text-anchor='start'>Oda talebiniz onaylandı: B-204 · 21 Eki · 3. ders</text>
<text x='96' y='210' font-size='12' font-weight='400' fill='#475569' text-anchor='start'>Mehmet Kaya onayladı.</text>
<text x='96' y='228' font-size='11' font-weight='400' fill='#64748B' text-anchor='start'>5 dk önce</text>
<circle cx='444' cy='186' r='5' fill='#2563EB'/>
<line x1='60' y1='244' x2='440' y2='244' stroke='#E2E8F0' stroke-width='1'/>
<circle cx='76' cy='274' r='9' fill='#B91C1C'/>
<text x='96' y='278' font-size='13' font-weight='700' fill='#0F172A' text-anchor='start'>Oda talebiniz reddedildi: C-105 · 22 Eki · 5. ders</text>
<text x='96' y='298' font-size='12' font-weight='400' fill='#475569' text-anchor='start'>Gerekçe: Kapasite yetersiz. Aynı saatte boş 2 derslik var.</text>
<text x='96' y='316' font-size='11' font-weight='400' fill='#64748B' text-anchor='start'>1 sa önce</text>
<circle cx='444' cy='274' r='5' fill='#2563EB'/>
<line x1='60' y1='332' x2='440' y2='332' stroke='#E2E8F0' stroke-width='1'/>
<circle cx='76' cy='362' r='9' fill='#B45309'/>
<text x='96' y='366' font-size='13' font-weight='500' fill='#0F172A' text-anchor='start'>Onay bekleyen oda talebi: B-204 · 23 Eki · 2. ders</text>
<text x='96' y='386' font-size='12' font-weight='400' fill='#475569' text-anchor='start'>Ayşe Yılmaz onay istiyor · 8 hafta · çakışma yok</text>
<text x='96' y='404' font-size='11' font-weight='400' fill='#64748B' text-anchor='start'>dün</text>
<line x1='60' y1='420' x2='440' y2='420' stroke='#E2E8F0' stroke-width='1'/>
<circle cx='76' cy='450' r='9' fill='#475569'/>
<text x='96' y='454' font-size='13' font-weight='500' fill='#0F172A' text-anchor='start'>Oda talebi geri çekildi: A-12 · 24 Eki · 1. ders</text>
<text x='96' y='474' font-size='12' font-weight='400' fill='#475569' text-anchor='start'>Can Demir geri çekti; bir şey yapmanız gerekmez.</text>
<text x='96' y='492' font-size='11' font-weight='400' fill='#64748B' text-anchor='start'>2 gün önce</text>
<line x1='60' y1='508' x2='440' y2='508' stroke='#E2E8F0' stroke-width='1'/>
<text x='60' y='610' font-size='13' font-weight='600' fill='#2563EB' text-anchor='start'>Bildirim tercihleri</text>
<text x='40' y='650' font-size='11' font-weight='500' fill='#7C3AED' text-anchor='start'>Başlık = e-posta konusu; gövde = ön başlık. Okunmamış: kalın başlık + mavi nokta.</text>
<text x='40' y='668' font-size='11' font-weight='500' fill='#7C3AED' text-anchor='start'>Rozet: sayı artınca bir kez 'pop' (bouncySubtle); sayfa açılışında ve azalınca yok.</text>
<rect x='392' y='20' width='44' height='36' rx='18' fill='#FFFFFF' fill-opacity='1' stroke='#E2E8F0' stroke-width='1'/>
<text x='414' y='43' font-size='12' font-weight='600' fill='#0F172A' text-anchor='middle'>Zil</text>
<rect x='424' y='14' width='22' height='18' rx='9' fill='#B91C1C' fill-opacity='1'/>
<text x='435' y='27' font-size='11' font-weight='700' fill='#FFFFFF' text-anchor='middle'>2</text>
<text x='520' y='50' font-size='18' font-weight='700' fill='#0F172A' text-anchor='start'>Bildirim (toast) yığını</text>
<rect x='536' y='92' width='380' height='52' rx='14' fill='#1E293B' fill-opacity='0.55'/>
<rect x='528' y='100' width='396' height='56' rx='14' fill='#1E293B' fill-opacity='0.75'/>
<rect x='520' y='112' width='412' height='60' rx='14' fill='#0F172A' fill-opacity='1'/>
<text x='540' y='147' font-size='14' font-weight='600' fill='#FFFFFF' text-anchor='start'>B-204 rezerve edildi</text>
<text x='912' y='147' font-size='14' font-weight='700' fill='#93C5FD' text-anchor='end'>Geri al</text>
<text x='520' y='196' font-size='11' font-weight='500' fill='#7C3AED' text-anchor='start'>En fazla 3; eskiler geride (ölçek .05, opaklık .85/.7); üzerine gelince açılır.</text>
<text x='520' y='214' font-size='11' font-weight='500' fill='#7C3AED' text-anchor='start'>Giriş 240 ms y16→0 (bulanıklık yok: cam), çıkış 160 ms; 8 sn (eylemli), üzerindeyken durur.</text>
<text x='520' y='270' font-size='18' font-weight='700' fill='#0F172A' text-anchor='start'>Uyarı bandı (koşul sürüyor)</text>
<rect x='520' y='290' width='860' height='56' rx='12' fill='#FEE2E2' fill-opacity='1'/>
<text x='540' y='324' font-size='14' font-weight='600' fill='#B91C1C' text-anchor='start'>E-posta gönderilemiyor: 535 kimlik doğrulama. 12 bildirim bekliyor.</text>
<text x='1360' y='324' font-size='14' font-weight='700' fill='#2563EB' text-anchor='end'>Sorunu gider</text>
<rect x='520' y='356' width='860' height='56' rx='12' fill='#FEF3C7' fill-opacity='1'/>
<text x='540' y='390' font-size='14' font-weight='600' fill='#B45309' text-anchor='start'>Microsoft 365 gizli anahtarının süresi 2 Kasım 2026 tarihinde doluyor.</text>
<text x='1360' y='390' font-size='14' font-weight='700' fill='#2563EB' text-anchor='end'>Anahtarı değiştir</text>
<text x='520' y='432' font-size='11' font-weight='500' fill='#7C3AED' text-anchor='start'>Akışta tam genişlik bloklar (üst üste binmez); en yeni üstte, en fazla 3 + '+n uyarı'.</text>
<text x='520' y='490' font-size='18' font-weight='700' fill='#0F172A' text-anchor='start'>Boş durum</text>
<rect x='520' y='510' width='420' height='200' rx='16' fill='#FFFFFF' fill-opacity='1' stroke='#E2E8F0' stroke-width='1'/>
<text x='540' y='560' font-size='16' font-weight='700' fill='#0F172A' text-anchor='start'>Henüz bildirim yok.</text>
<text x='540' y='586' font-size='14' font-weight='400' fill='#475569' text-anchor='start'>Talepleriniz ve rezervasyonlarınızla ilgili</text>
<text x='540' y='606' font-size='14' font-weight='400' fill='#475569' text-anchor='start'>gelişmeler burada görünür.</text>
<rect x='540' y='630' width='190' height='40' rx='20.0' fill='#FFFFFF' fill-opacity='1' stroke='#94A3B8' stroke-width='1'/>
<text x='635.0' y='655.04' font-size='14' font-weight='600' fill='#0F172A' text-anchor='middle'>Bildirim tercihleri</text>
<text x='1000' y='490' font-size='18' font-weight='700' fill='#0F172A' text-anchor='start'>Telefon · toast</text>
<rect x='1000' y='510' width='390' height='360' rx='24' fill='#F4F6F9' fill-opacity='1' stroke='#E2E8F0' stroke-width='1'/>
<rect x='1016' y='720' width='358' height='52' rx='14' fill='#0F172A' fill-opacity='1'/>
<text x='1034' y='752' font-size='14' font-weight='600' fill='#FFFFFF' text-anchor='start'>Talebiniz gönderildi: B-204</text>
<text x='1358' y='752' font-size='14' font-weight='700' fill='#93C5FD' text-anchor='end'>Görüntüle</text>
<rect x='1000' y='790' width='390' height='80' rx='0' fill='#FFFFFF' fill-opacity='1'/>
<line x1='1000' y1='790' x2='1390' y2='790' stroke='#E2E8F0' stroke-width='1'/>
<text x='1039.0' y='840' font-size='10' font-weight='500' fill='#64748B' text-anchor='middle'>Panel</text>
<text x='1117.0' y='840' font-size='10' font-weight='500' fill='#64748B' text-anchor='middle'>Takvim</text>
<text x='1195.0' y='840' font-size='10' font-weight='500' fill='#64748B' text-anchor='middle'>Rezerve et</text>
<text x='1273.0' y='840' font-size='10' font-weight='500' fill='#64748B' text-anchor='middle'>Talepler</text>
<text x='1351.0' y='840' font-size='10' font-weight='500' fill='#64748B' text-anchor='middle'>Daha</text>
<text x='1000' y='704' font-size='11' font-weight='500' fill='#7C3AED' text-anchor='start'>Sekme çubuğunun ve güvenli alanın 8 px üstünde; en fazla 2.</text>
