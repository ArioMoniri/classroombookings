<text x='72' y='527' font-size='14' font-weight='400' fill='#0F172A' text-anchor='start'>Profil</text>
<text x='68' y='568' font-size='11' font-weight='600' fill='#64748B' text-anchor='start'>YARDIM</text>
<rect x='60' y='584' width='284' height='36' rx='8' fill='#EFF6FF' fill-opacity='1'/>
<text x='72' y='607' font-size='14' font-weight='500' fill='#2563EB' text-anchor='start'>Turu yeniden başlat</text>
<text x='72' y='647' font-size='14' font-weight='400' fill='#0F172A' text-anchor='start'>Başlarken listesi</text>
<text x='332' y='647' font-size='12' font-weight='600' fill='#64748B' text-anchor='end'>2 / 5</text>
<text x='72' y='687' font-size='14' font-weight='400' fill='#0F172A' text-anchor='start'>Neler yeni</text>
<text x='332' y='687' font-size='12' font-weight='600' fill='#64748B' text-anchor='end'>●</text>
<text x='72' y='727' font-size='14' font-weight='400' fill='#0F172A' text-anchor='start'>Klavye kısayolları</text>
<text x='332' y='727' font-size='12' font-weight='600' fill='#64748B' text-anchor='end'>?</text>
<text x='68' y='768' font-size='11' font-weight='600' fill='#64748B' text-anchor='start'></text>
<text x='72' y='807' font-size='14' font-weight='400' fill='#0F172A' text-anchor='start'>Çıkış yap</text>
<text x='372' y='560' font-size='10' font-weight='500' fill='#7C3AED' text-anchor='start'>also in ⌘K: ‘Turu yeniden başlat’</text>
<text x='372' y='576' font-size='10' font-weight='500' fill='#7C3AED' text-anchor='start'>restart opens the sheet for the current audience</text>
<rect x='716' y='440' width='692' height='420' rx='16' fill='#FFFFFF' fill-opacity='1' stroke='#E2E8F0' stroke-width='1'/>
<text x='736' y='472' font-size='13' font-weight='600' fill='#64748B' text-anchor='start'>D · Telefonda ipucu (sayfa başında kart)</text>
<rect x='880' y='492' width='300' height='352' rx='24' fill='#F4F6F9' fill-opacity='1' stroke='#E2E8F0' stroke-width='1'/>
<text x='896' y='530' font-size='20' font-weight='700' fill='#0F172A' text-anchor='start'>Profil</text>
<rect x='896' y='548' width='268' height='108' rx='14' fill='#EFF6FF' fill-opacity='1' stroke='#2563EB' stroke-width='1'/>
<text x='910' y='574' font-size='14' font-weight='700' fill='#0F172A' text-anchor='start'>Yeni: Takvimime ekle</text>
<text x='910' y='596' font-size='12' font-weight='400' fill='#475569' text-anchor='start'>Derslerinizi kendi takviminize</text>
<text x='910' y='612' font-size='12' font-weight='400' fill='#475569' text-anchor='start'>ekleyin.</text>
<rect x='910' y='620' width='110' height='30' rx='15.0' fill='#2563EB' fill-opacity='1'/>
<text x='965.0' y='639.68' font-size='13' font-weight='600' fill='#FFFFFF' text-anchor='middle'>Dene</text>
<rect x='1030' y='620' width='120' height='30' rx='15.0' fill='#FFFFFF' fill-opacity='1' stroke='#94A3B8' stroke-width='1'/>
<text x='1090.0' y='639.68' font-size='13' font-weight='600' fill='#0F172A' text-anchor='middle'>Anladım</text>
<text x='736' y='870' font-size='10' font-weight='500' fill='#7C3AED' text-anchor='start'>phones: inline card, pushes content down, no overlay (mock at ~70 % scale; real buttons are 44 px)</text>
</svg>
