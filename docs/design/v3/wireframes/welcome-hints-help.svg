<svg xmlns='http://www.w3.org/2000/svg' width='1440' height='900' viewBox='0 0 1440 900' font-family='-apple-system,BlinkMacSystemFont,Inter,Segoe UI,sans-serif' role='img' aria-label='Per-feature hints and the Help menu'>
<title>Per-feature hints and the Help menu</title>
<rect width='1440' height='900' fill='#F4F6F9'/>
<text x='32' y='48' font-size='22' font-weight='700' fill='#0F172A' text-anchor='start'>Özellik ipuçları (wave 3) ve Yardım menüsü</text>
<rect x='32' y='80' width='660' height='330' rx='16' fill='#FFFFFF' fill-opacity='1' stroke='#E2E8F0' stroke-width='1'/>
<text x='52' y='112' font-size='13' font-weight='600' fill='#64748B' text-anchor='start'>A · Yeni özellik ipucu (masaüstü, bir kez)</text>
<rect x='52' y='132' width='220' height='36' rx='8' fill='#EFF6FF' fill-opacity='1'/>
<text x='68' y='156' font-size='13' font-weight='600' fill='#2563EB' text-anchor='start'>Hızlı rezervasyon</text>
<rect x='196' y='140' width='42' height='20' rx='10' fill='#EFF6FF' fill-opacity='1'/>
<text x='217.0' y='154' font-size='11' font-weight='600' fill='#2563EB' text-anchor='middle'>Yeni</text>
<rect x='292' y='128' width='380' height='176' rx='16' fill='#FFFFFF' fill-opacity='1' stroke='#2563EB' stroke-width='1.5'/>
<text x='312' y='158' font-size='15' font-weight='700' fill='#0F172A' text-anchor='start'>Yeni: Hızlı rezervasyon</text>
<text x='312' y='182' font-size='13' font-weight='400' fill='#475569' text-anchor='start'>Bugünün bir sonraki boş saati hazır gelir.</text>
<text x='312' y='200' font-size='13' font-weight='400' fill='#475569' text-anchor='start'>Salonu seçin, Rezerve et'e dokunun.</text>
<rect x='312' y='236' width='120' height='44' rx='22.0' fill='#2563EB' fill-opacity='1'/>
<text x='372.0' y='263.4' font-size='15' font-weight='600' fill='#FFFFFF' text-anchor='middle'>Dene</text>
<rect x='444' y='236' width='120' height='44' rx='22.0' fill='#FFFFFF' fill-opacity='1' stroke='#94A3B8' stroke-width='1'/>
<text x='504.0' y='263.4' font-size='15' font-weight='600' fill='#0F172A' text-anchor='middle'>Anladım</text>
<text x='52' y='330' font-size='10' font-weight='500' fill='#7C3AED' text-anchor='start'>non-modal popover (role=dialog, aria-modal=false); focus is NOT moved; F6 / ‘?’ reaches it</text>
<text x='52' y='346' font-size='10' font-weight='500' fill='#7C3AED' text-anchor='start'>max one auto hint per page view; never while a sheet, tour or dialog is open</text>
<text x='52' y='362' font-size='10' font-weight='500' fill='#7C3AED' text-anchor='start'>dismiss = Anladım / Esc / click outside → state ‘seen’ on the server</text>
<rect x='716' y='80' width='692' height='330' rx='16' fill='#FFFFFF' fill-opacity='1' stroke='#E2E8F0' stroke-width='1'/>
<text x='736' y='112' font-size='13' font-weight='600' fill='#64748B' text-anchor='start'>B · Yönetici ipucu (sayfa içi şerit)</text>
<rect x='736' y='132' width='652' height='76' rx='12' fill='#EFF6FF' fill-opacity='1' stroke='#2563EB' stroke-width='1'/>
<text x='756' y='160' font-size='15' font-weight='700' fill='#0F172A' text-anchor='start'>Yeni: Yapay zekâ ayarları</text>
<text x='756' y='184' font-size='13' font-weight='400' fill='#475569' text-anchor='start'>Sağlayıcıları, özellik başına modeli ve aylık sınırı buradan seçin.</text>
<text x='1372' y='160' font-size='13' font-weight='600' fill='#2563EB' text-anchor='end'>Anladım</text>
<rect x='736' y='220' width='652' height='160' rx='12' fill='#F8FAFC' fill-opacity='1' stroke='#E2E8F0' stroke-width='1'/>
<text x='756' y='250' font-size='13' font-weight='400' fill='#64748B' text-anchor='start'>/admin/ai içeriği</text>
<text x='736' y='400' font-size='10' font-weight='500' fill='#7C3AED' text-anchor='start'>same pattern for /admin/ops, /admin/integrations, calendar export (Profil › Takvim)</text>
