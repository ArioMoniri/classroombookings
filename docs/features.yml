# SmartSched feature registry: the source of the "What is built" tables (docs/STATUS.md, README.md).
# scripts/docs/sync_docs.py renders it; edit this file, not the generated tables, then run
#   python3 -I scripts/docs/sync_docs.py
# When an agent finishes a feature it updates its row here (status + evidence); docs/ROADMAP.md stays the
# detailed log. Seeded 2026-10-15 from the README "What is built" table and docs/ROADMAP.md.
#
# Format (a YAML subset the generator reads without PyYAML): one "- feature:" item per feature, each key on its
# own line, values in double quotes when they contain ": " or start with a YAML symbol.
#   feature   what a user gets, one sentence
#   area      planning | intake | bookings | identity | languages | platform
#   status    done (code, tests and a screen) | backend-only (API + tests, no screen yet) |
#             in-progress (an agent is building it now) | planned
#   phase     the roadmap phase or ticket
#   evidence  a repo path that proves it (a test, an e2e spec, a module); must exist
#   note      optional, one short clause

